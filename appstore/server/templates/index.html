<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro-Go App Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .search-box {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .app-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .app-icon {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            color: white;
        }
        
        .app-info {
            padding: 15px;
        }
        
        .app-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .app-author {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
        
        .app-description {
            font-size: 0.9em;
            color: #777;
            margin-bottom: 10px;
            height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .app-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #666;
        }
        
        .app-rating {
            color: #f39c12;
            font-weight: bold;
        }
        
        .app-price {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .app-price.free {
            color: #27ae60;
        }
        
        .app-actions {
            display: flex;
            gap: 10px;
        }
        
        .app-actions button {
            flex: 1;
            padding: 10px;
            font-size: 0.9em;
        }
        
        .btn-download {
            background: #27ae60;
        }
        
        .btn-download:hover {
            background: #229954;
        }
        
        .btn-details {
            background: #3498db;
        }
        
        .btn-details:hover {
            background: #2980b9;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }
        
        .error {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .close-modal {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close-modal:hover {
            color: black;
        }
        
        .modal-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-icon {
            font-size: 3em;
            margin-right: 20px;
        }
        
        .modal-title {
            flex: 1;
        }
        
        .modal-title h2 {
            margin: 0;
            color: #333;
        }
        
        .modal-title p {
            margin: 5px 0 0 0;
            color: #666;
        }
        
        .modal-details {
            margin: 20px 0;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .detail-label {
            font-weight: bold;
            color: #666;
        }
        
        .detail-value {
            color: #333;
        }
        
        .rating-display {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stars {
            color: #f39c12;
            font-size: 1.2em;
        }
        
        .modal-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        
        .modal-actions button {
            flex: 1;
        }
        
        .reviews {
            margin-top: 20px;
        }
        
        .review {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .review-stars {
            color: #f39c12;
        }
        
        .review-title {
            font-weight: bold;
            color: #333;
        }
        
        .review-text {
            color: #666;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .apps-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Retro-Go App Store</h1>
            <p class="subtitle">Download and manage apps for your retro gaming device</p>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search apps...">
                <button onclick="searchApps()">Search</button>
            </div>
            
            <div class="filters">
                <button class="filter-btn" onclick="filterByCategory('all')">All</button>
                <button class="filter-btn" onclick="filterByCategory('game')">Games</button>
                <button class="filter-btn" onclick="filterByCategory('utility')">Utilities</button>
                <button class="filter-btn" onclick="filterByCategory('emulator')">Emulators</button>
                <button class="filter-btn" onclick="toggleFeatured()">Featured</button>
            </div>
        </header>
        
        <div id="error" class="error" style="display: none;"></div>
        <div id="loading" class="loading" style="display: none;">Loading apps...</div>
        <div id="appsContainer" class="apps-grid"></div>
    </div>
    
    <!-- App Details Modal -->
    <div id="appModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <div class="modal-icon">🎮</div>
                <div class="modal-title">
                    <h2 id="modalAppName"></h2>
                    <p id="modalAppAuthor"></p>
                </div>
            </div>
            
            <div id="modalAppDetails" class="modal-details"></div>
            
            <div id="modalReviews" class="reviews"></div>
            
            <div class="modal-actions">
                <button class="btn-download" onclick="downloadApp()">Download</button>
                <button class="btn-details" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api/v1/device';
        let currentFilter = 'all';
        let showFeaturedOnly = false;
        let allApps = [];
        let selectedApp = null;
        
        // Initialize app on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadApps();
        });
        
        async function loadApps() {
            showLoading(true);
            try {
                let url = `${API_BASE}/apps`;
                const params = new URLSearchParams();
                
                if (currentFilter !== 'all') {
                    params.append('category', currentFilter);
                }
                
                if (showFeaturedOnly) {
                    params.append('featured', 'true');
                }
                
                params.append('limit', '50');
                
                if (params.toString()) {
                    url += '?' + params.toString();
                }
                
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to load apps');
                
                const data = await response.json();
                allApps = data.apps || [];
                
                displayApps(allApps);
                showLoading(false);
            } catch (error) {
                showError(error.message);
                showLoading(false);
            }
        }
        
        function displayApps(apps) {
            const container = document.getElementById('appsContainer');
            
            if (!apps || apps.length === 0) {
                container.innerHTML = '<div class="loading">No apps found</div>';
                return;
            }
            
            container.innerHTML = apps.map(app => `
                <div class="app-card" onclick="openAppDetails('${app.id}')">
                    <div class="app-icon">
                        ${getAppIcon(app.category)}
                    </div>
                    <div class="app-info">
                        <div class="app-name">${app.name}</div>
                        <div class="app-author">by ${app.author}</div>
                        <div class="app-description">${app.description}</div>
                        <div class="app-stats">
                            <span class="app-rating">⭐ ${app.rating.toFixed(1)}</span>
                            <span>📥 ${app.download_count}</span>
                        </div>
                        <div class="app-price ${app.price === 0 ? 'free' : ''}">
                            ${app.price === 0 ? 'FREE' : '$' + app.price.toFixed(2)}
                        </div>
                        <div class="app-actions">
                            <button class="btn-download" onclick="downloadApp('${app.id}'); event.stopPropagation();">Download</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function getAppIcon(category) {
            const icons = {
                'game': '🎮',
                'utility': '🔧',
                'emulator': '👾',
                'tool': '🛠️'
            };
            return icons[category] || '📦';
        }
        
        async function openAppDetails(appId) {
            try {
                const response = await fetch(`${API_BASE}/apps/${appId}`);
                if (!response.ok) throw new Error('Failed to load app details');
                
                const data = await response.json();
                selectedApp = data.app;
                
                // Fill modal
                document.getElementById('modalAppName').textContent = selectedApp.name;
                document.getElementById('modalAppAuthor').textContent = `by ${selectedApp.author} (v${selectedApp.version})`;
                
                let details = `
                    <div class="detail-row">
                        <span class="detail-label">Category:</span>
                        <span class="detail-value">${selectedApp.category}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Price:</span>
                        <span class="detail-value">${selectedApp.price === 0 ? 'Free' : '$' + selectedApp.price.toFixed(2)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Rating:</span>
                        <span class="detail-value">
                            <span class="rating-display">
                                <span class="stars">${'⭐'.repeat(Math.round(selectedApp.rating))}</span>
                                ${selectedApp.rating.toFixed(1)}
                            </span>
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Downloads:</span>
                        <span class="detail-value">${selectedApp.download_count}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Size:</span>
                        <span class="detail-value">${formatBytes(selectedApp.file_size)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Released:</span>
                        <span class="detail-value">${new Date(selectedApp.release_date).toLocaleDateString()}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Description:</span>
                        <span class="detail-value">${selectedApp.description}</span>
                    </div>
                `;
                
                if (selectedApp.min_version) {
                    details += `
                        <div class="detail-row">
                            <span class="detail-label">Min Version:</span>
                            <span class="detail-value">${selectedApp.min_version}</span>
                        </div>
                    `;
                }
                
                if (selectedApp.required_space) {
                    details += `
                        <div class="detail-row">
                            <span class="detail-label">Space Required:</span>
                            <span class="detail-value">${formatBytes(selectedApp.required_space)}</span>
                        </div>
                    `;
                }
                
                document.getElementById('modalAppDetails').innerHTML = details;
                
                // Display reviews
                if (selectedApp.reviews && selectedApp.reviews.length > 0) {
                    const reviewsHtml = selectedApp.reviews.map(review => `
                        <div class="review">
                            <div class="review-header">
                                <span class="review-title">${review.title || 'Review'}</span>
                                <span class="review-stars">${'⭐'.repeat(review.rating)}</span>
                            </div>
                            <p class="review-text">${review.comment || ''}</p>
                        </div>
                    `).join('');
                    
                    document.getElementById('modalReviews').innerHTML = '<h3>Reviews</h3>' + reviewsHtml;
                }
                
                document.getElementById('appModal').style.display = 'block';
            } catch (error) {
                showError(error.message);
            }
        }
        
        function closeModal() {
            document.getElementById('appModal').style.display = 'none';
            selectedApp = null;
        }
        
        function downloadApp(appId = null) {
            if (!appId && selectedApp) {
                appId = selectedApp.id;
            }
            
            if (!appId) return;
            
            // Generate a device ID (in real app, this would come from the device)
            const deviceId = localStorage.getItem('deviceId') || 'web-browser-' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('deviceId', deviceId);
            
            // Download the file
            window.location.href = `${API_BASE}/apps/${appId}/download?device_id=${deviceId}`;
        }
        
        function filterByCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach((btn, idx) => {
                if ((category === 'all' && idx === 0) || 
                    (category !== 'all' && btn.textContent.toLowerCase().includes(category))) {
                    btn.classList.add('active');
                } else if (category !== 'all' || idx !== 0) {
                    btn.classList.remove('active');
                }
            });
            loadApps();
        }
        
        function toggleFeatured() {
            showFeaturedOnly = !showFeaturedOnly;
            loadApps();
        }
        
        function searchApps() {
            const query = document.getElementById('searchInput').value;
            const filtered = allApps.filter(app => 
                app.name.toLowerCase().includes(query.toLowerCase()) ||
                app.description.toLowerCase().includes(query.toLowerCase()) ||
                app.author.toLowerCase().includes(query.toLowerCase())
            );
            displayApps(filtered);
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = 'Error: ' + message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('appModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
